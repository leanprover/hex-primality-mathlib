name = "hex-primality-mathlib-conformance"
defaultTargets = ["HexPrimalityMathlibConformance"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPrimalityMathlib"
path = ".."

[[lean_lib]]
name = "HexPrimalityMathlibConformance"
globs = [
  "HexPrimalityMathlib.Conformance",
  "HexPrimalityMathlibConformance.OptIn",
]
