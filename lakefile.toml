name = "hex-primality-mathlib"
defaultTargets = ["HexPrimalityMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPrimality"
git = "https://github.com/leanprover/hex-primality.git"
rev = "3a0a1c4c5fae6d6aa7a6893dfcf26199bd043ffb"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexPrimalityMathlib"
